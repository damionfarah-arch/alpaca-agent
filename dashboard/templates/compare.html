<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%97%A2%3C/text%3E%3C/svg%3E">
  <title>alpaca-agent :: compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-poll="{{ poll_seconds }}">

  <header class="topbar">
    <div class="brand">&#9702; ALPACA&middot;AGENT <span class="sub">compare</span></div>
    <div class="pills" id="cmpMeta"></div>
    <div class="clock">
      <span id="lastUpdated">connecting&hellip;</span>
      <span class="beat" id="beat"></span>
    </div>
  </header>

  <div id="banner"></div>

  <section class="panel">
    <div class="panel-h">Leaderboard <span class="hint">ranked by all-time return</span></div>
    <div id="board"><div class="empty">loading&hellip;</div></div>
  </section>

  <section class="panel">
    <div class="panel-h">Portfolio Value <span class="muted" id="curveMeta"></span></div>
    <div id="cmpChart"><div class="empty">no equity history yet</div></div>
    <div class="cmp-legend" id="cmpLegend"></div>
  </section>

  <footer id="footer"><span>each agent's full dashboard is one click away from its card above</span></footer>

  <script src="{{ url_for('static', filename='compare.js') }}"></script>
</body>
</html>
